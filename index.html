<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>House Cup 2026 - Live Standings</title><link rel="stylesheet" href="styles.css?v=1793091147"></head>
<body>
<header class="top"><div class="brand"><img src="assets/tomstars.png" alt="Tomstars"><i></i><b>House Cup</b></div>
<span class="upd" id="upd"></span></header>
<main>
<section class="hero"><div class="t"><span class="eyebrow">Route to the Cup</span>
<h1><span id="h1">House Cup 2026 - Live Standings</span> <span class="livetag big"><i></i>LIVE</span></h1><h2 id="lead_" class="leadline"></h2><p id="sub"></p></div>
<div class="stats"><div class="stat"><span>Total points</span><b id="total">–</b></div><div class="stat"><span>Entries logged</span><b id="count">–</b></div></div></section>
<section class="finals"><div class="fhead"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M3 7l4.500 4L12 4l4.500 7L21 7l-2 11H5L3 7z"/></svg><h2>Grand Finals · Today</h2><span>Winner +100 pts · Runner-up +50 pts</span></div><div class="fgrid" id="fgrid"></div></section>
<section class="cards" id="cards"></section>
<section class="cols">
<div class="card race"><div class="race-h"><h2>Race to the Cup</h2><span class="legend"><span class="flag"></span>Bars show distance to the leader</span></div><div id="race" style="display:flex;flex-direction:column;gap:28px"></div></div>
<aside class="card recent"><div class="rh"><h2>Recent entries</h2><span id="shown"></span></div><div class="pills" id="filters"></div><ul class="list" id="log"></ul></aside>
</section></main>
<footer>Created with 💖 by Tomstars 2026</footer>
<script src="common.js?v=1793091147"></script>
<script>
let entries=[], finals=[], filter='All';
function render(){
  const stats=houseStats(entries), t=totals(entries), order=ranked(t), lead=t[order[0]]||1;
  lead_.textContent=`${order[0]} leads the House Cup`;
  sub.textContent=`${fmt(lead-t[order[1]])} pts clear of ${order[1]}, with ${fmt(Object.values(t).reduce((a,b)=>a+b,0))} points scored across all houses.`;
  total.textContent=fmt(Object.values(t).reduce((a,b)=>a+b,0)); count.textContent=fmt(entries.length);
  cards.innerHTML=Object.keys(HOUSES).map(h=>{const c=HOUSES[h],s=stats[h];return `<div class="hcard" style="background:${c.solid}"><div class="hc-top"><span class="letter">${h[0]}</span><b>${c.full}</b></div><div class="hc-n"><div><small>Activities</small><strong>${fmt(s.acts)}</strong></div><div><small>Unique participants</small><strong>${fmt(s.people)}</strong></div></div></div>`}).join('');
  fgrid.innerHTML=renderFinals(finals);
  race.innerHTML=order.map((h,i)=>{const c=HOUSES[h];return `<div class="house"><div class="hrow"><div class="hl">${chip(h)}<span class="hname">${c.full}</span><span class="badge" style="background:${i?'#F3F3F4':'#FDC530'}">${i?'#'+(i+1):'Leading'}</span></div><span class="hpts" style="color:${c.text}">${fmt(t[h])} <small>pts</small></span></div>
  <div class="track"><div class="fill" style="width:${(t[h]/lead*100).toFixed(1)}%;background:${c.tint}"><span class="knob" style="background:${c.solid}">${i+1}</span></div><span class="flag"></span></div>
  <span class="gap">${i?fmt(lead-t[h])+' pts behind '+order[0]:'Ahead of '+order[1]+' by '+fmt(lead-t[order[1]])+' pts'}</span></div>`}).join('');
  filters.innerHTML=['All','Blue','White','Red','Green'].map(f=>`<button class="pill" aria-pressed="${f===filter}" data-f="${f}">${f}</button>`).join('');
  const list=entries.filter(e=>filter==='All'||e.house===filter);
  shown.textContent=`${list.length} shown`;
  log.innerHTML=list.map(e=>`<li>${chip(e.house,'sm')}<div class="li-t"><b>${entryTitle(e)}</b></div><span class="pts">+${fmt(e.points)}</span></li>`).join('');
}
filters.onclick=e=>{const f=e.target.dataset.f; if(f){filter=f;render();}};
async function refresh(){ try{ [entries,finals]=await Promise.all([loadEntries(),loadFinals()]); render(); upd.textContent='Updated '+new Date().toLocaleTimeString(); }catch(e){ h1.textContent='Could not load standings'; console.error(e); } }
let dir=1,pause=0;
setInterval(()=>{ if(matchMedia('(prefers-reduced-motion: reduce)').matches||log.matches(':hover'))return;
  if(pause>0){pause--;return;}
  const max=log.scrollHeight-log.clientHeight; if(max<=0)return;
  if(log.scrollTop>=max-1){pause=80;setTimeout(()=>{log.scrollTop=0},1500);return;}
  log.scrollTop+=1;},50);
refresh(); setInterval(refresh,60000);
</script></body></html>
