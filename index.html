<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>House Cup 2026 - Live Standings</title><link rel="stylesheet" href="dashboard.css?v=1793096126"></head>
<body>
<header class="top"><div class="brand"><img src="assets/tomstars.png" alt="Tomstars"></div>
<div class="ttl"><h1>House Cup 2026 - Live Standings<span class="live"><i></i>LIVE</span></h1><p class="sub" id="sub"></p></div>
<div class="hr"><a class="navlink" href="journeys.html">Player journeys →</a><div class="stats"><div class="stat"><span>Total points</span><b id="total">–</b></div><div class="stat"><span>Entries logged</span><b id="count">–</b></div></div><span class="upd" id="upd"></span></div></header>
<main>
<div class="grid">
<section class="card finals" aria-label="Grand Finals">
<div class="fh"><span class="crown"><svg viewBox="0 0 24 24" width="24" height="24" fill="#13131C" aria-hidden="true"><path d="M3 7l4.500 4L12 4l4.500 7L21 7l-2 11H5L3 7z"/></svg></span><div><h2>Grand Finals</h2><small>Winner +100 pts · Runner-up +50 pts</small></div></div>
<div class="fgrid" id="fgrid"></div></section>
<div class="col">
<section class="card race"><h2>Race to the Cup</h2><div id="race"></div></section>
<aside class="card recent"><div class="rh"><h2>Recent entries</h2><span id="shown"></span></div><div class="pills" id="filters"></div><ul class="list" id="log"></ul></aside>
</div></div></main>
<footer>Created with 💖 by Tomstars 2026</footer>
<script src="common.js?v=1793095846"></script>
<script>
let entries=[], finals=[], filter='All';
function renderFinalsPanel(){ fgrid.innerHTML=['Darts','Jenga','Chess','Carrom','Pool','Table Tennis'].map(s=>sportCard(s,finals)).join(''); }
function render(){
  const stats=houseStats(entries), t=totals(entries), order=ranked(t), lead=t[order[0]]||1, sum=Object.values(t).reduce((a,b)=>a+b,0);
  sub.textContent=`${HOUSES[order[0]].full} lead by ${fmt(lead-t[order[1]])} pts over ${HOUSES[order[1]].full}`;
  total.textContent=fmt(sum); count.textContent=fmt(entries.length);
  race.innerHTML=order.map((h,i)=>{const c=HOUSES[h],s=stats[h];return `<div class="rr">${chip(h)}<div class="rm"><div class="rl"><b>${c.full}</b><small>${fmt(s.acts)} activities · ${fmt(s.people)} people</small><strong style="color:${c.text}">${fmt(t[h])}</strong></div><div class="track"><div class="fill" style="width:${(t[h]/lead*100).toFixed(1)}%;background:${c.solid}"></div></div></div></div>`}).join('');
  filters.innerHTML=['All','Blue','White','Green','Red'].map(f=>`<button class="pill" aria-pressed="${f===filter}" data-f="${f}">${f}</button>`).join('');
  const list=entries.filter(e=>filter==='All'||e.house===filter); shown.textContent=`${list.length} shown`;
  log.innerHTML=list.map(e=>`<li>${chip(e.house)}<div class="li-t">${entryTitle(e)}</div><span class="pts2">+${fmt(e.points)}</span></li>`).join('');
  renderFinalsPanel();
}
filters.onclick=e=>{const f=e.target.dataset.f; if(f){filter=f;render();}};
let pause=0;
setInterval(()=>{ if(matchMedia('(prefers-reduced-motion: reduce)').matches||log.matches(':hover'))return;
  if(pause>0){pause--;return;}
  const max=log.scrollHeight-log.clientHeight; if(max<=0)return;
  if(log.scrollTop>=max-1){pause=80;setTimeout(()=>{log.scrollTop=0},1500);return;}
  log.scrollTop+=1;},50);
async function refresh(){ try{ [entries,finals]=await Promise.all([loadEntries(),loadFinals()]); render(); upd.textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}); }catch(e){ sub.textContent='Could not load standings'; console.error(e); } }
refresh(); setInterval(refresh,60000);
</script></body></html>
